name: Linux build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Xvfb and Avalonia runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libfontconfig1 libice6 libsm6 libx11-6 libxext6 libxrender1
      - name: Build solution
        run: dotnet build PCPulse.sln -c Release --warnaserror
      - name: Run tests
        run: dotnet test PCPulse.sln -c Release --no-build
      - name: Smoke test Linux graphical startup under Xvfb
        run: |
          set -euo pipefail
          xvfb-run -a dotnet run --project src/PCPulse.App/PCPulse.App.csproj -c Release --no-build -- --startup-smoke-test
          LOG_FILE="${XDG_STATE_HOME:-$HOME/.local/state}/pcpulse/logs/app.log"
          grep -q "Проверка запуска PCPulse пройдена" "$LOG_FILE"
